name: Validate module and reference
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - name: Record immutable source archive integrity
        run: |
          curl -fLsS "https://codeload.github.com/jordan61-dot/National-Parks-Explorer/tar.gz/${GITHUB_SHA}" -o /tmp/parks-module.tar.gz
          echo "MODULE_INTEGRITY=sha512-$(openssl dgst -sha512 -binary /tmp/parks-module.tar.gz | base64 -w0)"
      - run: npm run check
      - run: npm test
      - run: npm run test:compiler
      - run: npm run reference:build
      - run: python scripts/validate.py
      - run: git diff --exit-code -- src/data
