name: Collect park photo candidates
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect-park-photos.yml']
permissions:
  contents: write
concurrency:
  group: park-photo-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip-07143-photos
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Collect bounded batch
        run: timeout --signal=INT --kill-after=30s 18m python -u scripts/acquire_photo07143.py --limit 20 --candidate-limit 8
      - name: Persist checkpoint even after collection failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/evidence/photo07143-candidates.json scripts/evidence/photo07143-report.json src/media072/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint unreviewed park photo candidates'
            git push origin HEAD:wip-07143-photos
          fi
      - name: Record accepted coverage
        if: always()
        run: |
          python scripts/photo_coverage07143.py >> "$GITHUB_STEP_SUMMARY" || test "$?" = 1
